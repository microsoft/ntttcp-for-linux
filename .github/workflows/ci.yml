name: Build using CI

on:
  push:
  pull_request:

jobs:
  build_x86-64:
    name: build x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cd src/ && cmake . && make && ls -lh ntttcp && file ntttcp

      - name: Uploads binary file for x86-64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntttcp-x86_64
          path: src/ntttcp
          retention-days: 5

  build_aarch64:
    name: build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: uraimo/run-on-arch-action@1e2c619f81e6d8609845ea1d2f443a778df1ac68 # v3
        name: Build artifact
        id: build
        with:
          arch: aarch64
          distro: ubuntu20.04
          run: |
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake file
            cd src/ && cmake . && make && ls -lh ntttcp && file ntttcp

      - name: Uploads binary file for aarch64
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntttcp-aarch64
          path: src/ntttcp
          retention-days: 5


  release_artifacts:
    name: release artifacts
    runs-on: ubuntu-latest
    needs: [build_x86-64, build_aarch64]
    steps:
      - name: releases the artifacts
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ntttcp-x86_64
            ntttcp-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
