name: Build using CI

on:
  push:
  pull_request:

jobs:
  build_x86-64:
    name: build x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cd src/ && cmake . && make && ls -lh ntttcp && file ntttcp

      - name: Uploads binary file for x86-64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ntttcp-x86_64
          path: src/ntttcp
          retention-days: 5

  build_aarch64:
    name: build aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: uraimo/run-on-arch-action@ac33288c3728ca72563c97b8b88dda5a65a84448 # v2
        name: Build artifact
        id: build
        with:
          arch: aarch64
          distro: ubuntu20.04
          run: |
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake file
            cd src/ && cmake . && make && ls -lh ntttcp && file ntttcp

      - name: Uploads binary file for aarch64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ntttcp-aarch64
          path: src/ntttcp
          retention-days: 5


  release_artifacts:
    name: release artifacts
    runs-on: ubuntu-latest
    needs: [build_x86-64, build_aarch64]
    steps:
      - name: releases the artifacts
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ntttcp-x86_64
            ntttcp-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
